<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hue Dashboard — Support</title>
<style>
  :root{
    --ink:#0a0916;
    --ember:#e2823d;
    --paper:#eeeafb;
    --muted:#9a92bd;
    --line:rgba(238,234,251,0.14);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  body{
    background:var(--ink);
    color:var(--paper);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  a{color:inherit;}

  .wrap{
    max-width:640px;
    margin:0 auto;
    padding-left:28px;
    padding-right:28px;
  }

  .page-head.wrap{
    text-align:center;
    padding-top:64px;
    padding-bottom:40px;
  }

  .back{
    display:block;
    text-align:left;
    font-size:13px;
    color:var(--muted);
    text-decoration:none;
    margin-bottom:32px;
  }
  .back:hover{
    color:var(--paper);
  }

  h1{
    font-size:26px;
    line-height:1.05;
    font-weight:700;
    letter-spacing:-0.02em;
    margin-bottom:8px;
  }

  .tagline{
    font-size:13px;
    font-weight:500;
    color:var(--ember);
  }

  main.wrap{
    padding-bottom:80px;
  }

  main p{
    font-size:14px;
    color:var(--muted);
    margin-bottom:12px;
  }

  main a{
    color:var(--paper);
  }
</style>
</head>
<body>

<header class="page-head wrap">
  <a class="back" href="/huedashboard/">&larr; Home</a>
  <h1>Hue Dashboard</h1>
  <p class="tagline">Support</p>
</header>

<main class="wrap">
  <p>Looking for help? I'd love to answer your questions. I'm an independent developer and work on Hue Dashboard in my spare time, so please allow a few business days for me to get back to you.</p>
  <p>Contact me at <a href="mailto:support+huedashboard@pimnijman.nl">support+huedashboard@pimnijman.nl</a>.</p>
</main>

</body>
</html>
